<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdelrahman: The Game</title>
<meta name="description" content="Abdelrahman Sultan, Technical Pre-Sales, BVS Sales Team. An interactive personal presentation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090c11;--ink:#eceff4;--dim:#a4adbd;--mut:#717c8f;--gold:#d9b97a;--gold2:#f1dcab;--blue:#4d7cff;--cy:#5ee0e6;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.2);
  --disp:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sx:30%;--sy:35%;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:16px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
kbd{font:500 10px var(--disp);color:var(--mut);border:1px solid var(--line2);border-radius:3px;padding:1px 5px;margin-left:7px;letter-spacing:.04em}
/* atmosphere */
#bg{position:fixed;inset:0;background:radial-gradient(55% 60% at var(--sx) var(--sy),rgba(77,124,255,.15),transparent 70%),radial-gradient(45% 50% at 90% 95%,rgba(217,185,122,.1),transparent 70%),linear-gradient(180deg,#0b0f16,#080a0f);transition:background .9s}
#grid{position:fixed;inset:0;opacity:.5;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 10%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 45%,#000 10%,transparent 72%);opacity:.14}
#noise{position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#dust{position:fixed;inset:0;pointer-events:none}
#frame{position:fixed;inset:12px;pointer-events:none;z-index:1;background:
 linear-gradient(var(--gold),var(--gold)) 0 0/14px 1px,linear-gradient(var(--gold),var(--gold)) 0 0/1px 14px,
 linear-gradient(var(--gold),var(--gold)) 100% 0/14px 1px,linear-gradient(var(--gold),var(--gold)) 100% 0/1px 14px,
 linear-gradient(var(--gold),var(--gold)) 0 100%/14px 1px,linear-gradient(var(--gold),var(--gold)) 0 100%/1px 14px,
 linear-gradient(var(--gold),var(--gold)) 100% 100%/14px 1px,linear-gradient(var(--gold),var(--gold)) 100% 100%/1px 14px;background-repeat:no-repeat;opacity:.55}
#app{position:fixed;inset:0;z-index:2;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* HUD */
#hud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:18px clamp(20px,4vw,56px) 10px}
.brand{display:flex;align-items:center;gap:12px;font:700 14px var(--disp);letter-spacing:.16em;white-space:nowrap}
.brand i{width:28px;height:1px;background:var(--gold)}
.brand span{font-weight:400;color:var(--mut);letter-spacing:.06em;font-size:13px}
#rail{display:flex;align-items:center;gap:4px}
.rn{display:flex;align-items:center;gap:0;height:34px;padding:0 10px;border:1px solid transparent;font:500 12px var(--disp);color:var(--mut);letter-spacing:.06em;transition:color .3s,border-color .3s,background .3s}
.rn span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .5s ease,margin .5s;margin-left:0}
.rn:hover{color:var(--ink)}
.rn.done{color:var(--gold)}
.rn.cur{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.04)}
.rn.cur span{max-width:190px;margin-left:10px}
.rn.cur i{color:var(--gold)}
.tools{display:flex;justify-content:flex-end;gap:8px}
.tools button{height:34px;padding:0 12px;border:1px solid var(--line);font:500 12px var(--disp);color:var(--dim);letter-spacing:.04em;display:flex;align-items:center;transition:border-color .25s,color .25s,background .25s}
.tools button:hover{border-color:var(--gold);color:var(--ink)}
.tools button.on{border-color:var(--gold);color:var(--gold);background:rgba(217,185,122,.08)}
/* stage */
#stage{min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 clamp(20px,4vw,56px);transition:opacity .17s ease,transform .17s ease}
#stage.leave{opacity:0;transform:translateX(-18px)}
#stage::-webkit-scrollbar{width:6px}#stage::-webkit-scrollbar-thumb{background:var(--line2)}
.slide{width:min(100%,1720px);margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2.6vh,30px);padding:clamp(6px,1.4vh,18px) 0}
[data-r]{opacity:0;transform:translateY(18px)}
.slide.in [data-r]{opacity:1;transform:none;transition:opacity .8s ease calc(var(--d,0)*70ms + 80ms),transform .9s cubic-bezier(.2,.7,.2,1) calc(var(--d,0)*70ms + 80ms)}
.cols{display:grid;gap:clamp(24px,4.5vw,84px);align-items:center}
.c2{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
.c2b{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
.wh{display:flex;align-items:baseline;gap:18px}
.wn{font:700 clamp(48px,min(6vw,10vh),120px)/.9 var(--disp);color:transparent;-webkit-text-stroke:1px var(--gold);letter-spacing:-.04em}
.wk{font:500 13px var(--disp);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.ttl{font:600 clamp(30px,min(4vw,6.6vh),82px)/1.03 var(--disp);letter-spacing:-.035em;margin:0}
.lead{font:500 clamp(16px,min(1.5vw,2.7vh),25px)/1.5 var(--sans);color:var(--dim);margin:0;max-width:33em}
.lead b{color:var(--ink);font-weight:700}
.pnl{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012))}
.pnl::before{content:"";position:absolute;inset:-1px;pointer-events:none;background:linear-gradient(var(--gold),var(--gold)) 0 0/10px 1px,linear-gradient(var(--gold),var(--gold)) 0 0/1px 10px,linear-gradient(var(--gold),var(--gold)) 100% 100%/10px 1px,linear-gradient(var(--gold),var(--gold)) 100% 100%/1px 10px;background-repeat:no-repeat}
.lab{font:500 11px var(--disp);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.spec{margin:0;display:grid;grid-template-columns:1fr}
.spec div{display:grid;grid-template-columns:minmax(90px,.35fr) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.spec div:first-child{border-top:1px solid var(--line)}
.spec dt{font:500 12px var(--disp);letter-spacing:.12em;color:var(--mut);text-transform:uppercase;align-self:center}
.spec dd{margin:0;font-weight:700;font-size:clamp(15px,1.25vw,20px)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font:500 12px var(--disp);letter-spacing:.06em;border:1px solid var(--line2);padding:6px 12px;color:var(--dim)}
/* portrait + orbit */
.orbit{position:relative;--pw:min(44vh,27vw);width:100%;max-width:calc(var(--pw)*1.75);height:calc(var(--pw)*1.32);margin:0 auto;display:grid;place-items:center;flex:none}
.orbit svg{position:absolute;left:50%;top:50%;width:calc(var(--pw)*1.3);height:calc(var(--pw)*1.3);transform:translate(-50%,-50%)}
.orbit .r1{transform-origin:50% 50%;animation:spin 140s linear infinite}
.orbit .r2{transform-origin:50% 50%;animation:spin 220s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit img{width:var(--pw);height:var(--pw);border-radius:50%;object-fit:cover;background:#e9e6df;display:block;box-shadow:0 0 0 1px var(--gold),0 0 0 10px rgba(9,12,17,.9),0 0 0 11px rgba(217,185,122,.4),0 30px 90px rgba(0,0,0,.6);position:relative;z-index:1;transition:transform .6s ease}
.orbit.sm{--pw:min(32vh,22vw);max-width:none;height:calc(var(--pw)*1.1)}.orbit.sm svg{width:calc(var(--pw)*1.22);height:calc(var(--pw)*1.22)}
.cl{position:absolute;z-index:3;font:500 10px var(--disp);color:var(--mut);letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--line2);border-left:2px solid var(--gold);background:rgba(9,12,17,.88);line-height:1.4}
.cl b{display:block;font:700 clamp(13px,1.1vw,17px) var(--disp);color:var(--ink);letter-spacing:0;text-transform:none}
.cl.a{left:0;top:6%}.cl.b{right:0;top:20%}.cl.c{left:0;bottom:16%}.cl.d{right:0;bottom:2%}
/* hero */
.hero h1{margin:0 0 6px;font:700 clamp(34px,min(5vw,11vh),108px)/.95 var(--disp);letter-spacing:-.05em;white-space:nowrap}
.hero h1 span{display:block;margin-top:.22em;font:500 .3em/1 var(--disp);letter-spacing:.42em;color:var(--gold)}
.eye{display:flex;align-items:center;gap:12px;font:500 12px var(--disp);letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
.eye::before{content:"";width:34px;height:1px;background:var(--gold)}
.role{font:500 clamp(17px,1.7vw,26px) var(--disp);margin:0;letter-spacing:-.01em}
.role em{font-style:normal;color:var(--gold)}
.cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.go{display:flex;align-items:center;gap:14px;height:56px;padding:0 26px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#14100a;font:700 15px var(--disp);letter-spacing:.04em;transition:transform .25s,box-shadow .25s;box-shadow:0 12px 40px rgba(217,185,122,.22)}
.go:hover{transform:translateY(-2px);box-shadow:0 18px 56px rgba(217,185,122,.38)}
.go svg{width:18px;height:18px}
.ghost{height:56px;padding:0 22px;border:1px solid var(--line2);font:500 14px var(--disp);color:var(--dim);display:flex;align-items:center;transition:border-color .25s,color .25s}
.ghost:hover{border-color:var(--gold);color:var(--ink)}
.metrics{display:flex;gap:clamp(18px,3vw,48px);border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.metrics div{font:500 12px var(--disp);color:var(--mut);letter-spacing:.06em}
.metrics b{display:block;font:700 clamp(22px,2.2vw,34px) var(--disp);color:var(--ink);letter-spacing:-.02em}
.bigstat{display:flex;gap:clamp(20px,4vw,64px)}
.bigstat b{display:block;font:700 clamp(54px,min(7vw,13vh),130px)/.95 var(--disp);color:var(--gold);letter-spacing:-.05em}
.bigstat span{font:500 13px var(--disp);color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
/* experience timeline */
.hl{position:relative;margin-top:clamp(8px,2vh,24px)}
.hl-line{position:absolute;left:0;right:0;top:calc(var(--lt,34px));height:1px;background:var(--line2)}
.hl-line i{position:absolute;left:0;top:-1px;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width 1.8s cubic-bezier(.6,0,.2,1) .5s}
.slide.in .hl-line i{width:100%}
.hl ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,48px)}
.hl li{position:relative;padding-top:56px}
.hl li::before{content:"";position:absolute;left:0;top:calc(var(--lt,34px) - 6px);width:13px;height:13px;background:var(--bg);border:2px solid var(--gold);border-radius:50%}
.hl li.now::before{background:var(--gold);box-shadow:0 0 0 6px rgba(217,185,122,.2),0 0 30px rgba(217,185,122,.6)}
.hl li small{position:absolute;left:0;top:0;font:500 12px var(--disp);letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.hl li h3{margin:0 0 8px;font:600 clamp(20px,min(2.2vw,3.6vh),38px)/1.1 var(--disp);letter-spacing:-.02em}
.hl li p{margin:0;color:var(--dim);max-width:22em}
.hl li.now h3{color:var(--gold)}
.polaroid{background:#eceff4;color:#101522;padding:8px 8px 10px;transform:rotate(-3deg);box-shadow:0 24px 60px rgba(0,0,0,.6);width:clamp(120px,12vw,190px)}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.polaroid i{display:block;text-align:center;font:700 13px var(--disp);padding-top:8px;font-style:normal}
/* education */
.cred{padding:clamp(14px,min(2vw,3vh),30px)}
.cred h3{margin:8px 0 4px;font:600 clamp(20px,min(2.2vw,3.6vh),36px)/1.1 var(--disp);letter-spacing:-.025em}
.cred p{margin:0;color:var(--dim)}
.st{position:absolute;right:20px;top:-14px;font:700 13px var(--disp);letter-spacing:.2em;color:#74e3ad;border:1.5px solid #74e3ad;padding:6px 12px;background:var(--bg);transform:rotate(-5deg)}
.slide.in .st{animation:slam .7s cubic-bezier(.2,1.4,.4,1) .8s both}
@keyframes slam{from{opacity:0;transform:rotate(-5deg) scale(2.4)}}
.path{list-style:none;margin:clamp(10px,2vh,18px) 0 0;padding:0 0 0 22px;border-left:1px solid var(--line2)}
.path li{position:relative;padding:0 0 clamp(8px,1.6vh,14px)}
.path li:last-child{padding-bottom:0}
.path li::before{content:"";position:absolute;left:-27px;top:7px;width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.path small{display:block;font:500 11px var(--disp);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.path b{font:600 clamp(16px,1.35vw,21px) var(--disp)}
.path span{color:var(--dim);margin-left:8px}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:clamp(8px,1.6vh,14px) 0;border-bottom:1px solid var(--line);align-items:baseline}
.log li:first-child{border-top:1px solid var(--line)}
.log small{font:500 11px var(--disp);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.log b{font:600 clamp(17px,1.5vw,23px) var(--disp)}
.log p{margin:2px 0 0;color:var(--dim);font-size:.95em}
.demo{padding:clamp(12px,min(1.5vw,2.4vh),24px)}
.demo h4{margin:6px 0 2px;font:600 clamp(18px,1.6vw,24px) var(--disp)}
.demo p{margin:0 0 clamp(6px,1.4vh,12px);color:var(--dim);font-size:.92em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.row>span{font:500 11px var(--disp);letter-spacing:.12em;color:var(--mut);text-transform:uppercase;min-width:64px}
.opt{border:1px solid var(--line2);padding:7px 14px;font:500 13px var(--disp);color:var(--dim);transition:border-color .2s,color .2s,background .2s}
.opt:hover{border-color:var(--gold);color:var(--ink)}
.opt.on{border-color:var(--gold);color:var(--gold2);background:rgba(217,185,122,.1)}
.out{min-height:2.6em;color:var(--gold2);font-weight:700;border-top:1px dashed var(--line2);padding-top:10px;margin-top:4px}
/* training stairs */
.stairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,32px);align-items:end;height:clamp(240px,46vh,460px)}
.step{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(16px,1.8vw,28px);height:var(--h);border:1px solid var(--line);background:linear-gradient(180deg,rgba(77,124,255,.14),rgba(77,124,255,.02));transform-origin:bottom;transition:border-color .3s}
.step::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:linear-gradient(90deg,var(--blue),var(--gold))}
.step:hover{border-color:var(--gold)}
.step .no{position:absolute;right:16px;top:12px;font:700 clamp(30px,3.6vw,60px)/1 var(--disp);color:transparent;-webkit-text-stroke:1px var(--line2)}
.step small{font:500 11px var(--disp);letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.step h3{margin:6px 0 4px;font:600 clamp(20px,2vw,32px)/1.1 var(--disp);letter-spacing:-.02em}
.step p{margin:0;color:var(--dim)}
.slide.in .step{animation:rise .9s cubic-bezier(.2,.7,.2,1) calc(var(--k)*140ms + .3s) both}
@keyframes rise{from{opacity:0;transform:scaleY(.6)}}
/* hobbies */
.hsel{display:grid;gap:0;align-self:stretch}
.hs{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;text-align:left;padding:18px 16px;border-bottom:1px solid var(--line);position:relative;transition:background .3s}
.hs:first-child{border-top:1px solid var(--line)}
.hs::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);transform:scaleY(0);transition:transform .35s}
.hs:hover{background:rgba(255,255,255,.03)}
.hs.on{background:rgba(217,185,122,.07)}.hs.on::before{transform:none}
.hs i{font:500 13px var(--disp);color:var(--mut)}
.hs.on i{color:var(--gold)}
.hs b{display:block;font:600 clamp(20px,2vw,32px)/1.1 var(--disp);letter-spacing:-.02em}
.hs small{color:var(--mut)}
.stagebox{padding:clamp(18px,2vw,32px);min-height:clamp(260px,46vh,480px);display:flex;flex-direction:column;justify-content:center}
.pad{display:flex;gap:10px;height:clamp(120px,24vh,230px);margin-bottom:14px}
.key{flex:1;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015));transition:background .2s,box-shadow .2s,border-color .2s}
.key:hover{border-color:var(--gold)}
.key.hit{background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 40px rgba(217,185,122,.5)}
.lift{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:16px}
.bar{transition:transform .22s ease-out}
.meter{height:6px;background:rgba(255,255,255,.1);margin:8px 0 16px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.meter.o i{background:linear-gradient(90deg,var(--blue),var(--cy))}
.mt small{font:500 11px var(--disp);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
/* strengths constellation */
.cs{position:relative;--cs:min(60vh,38vw);width:var(--cs);height:var(--cs);margin:0 auto}
.cs svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cs line{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 5}
.cs .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;text-align:center;font:700 clamp(10px,.9vw,13px) var(--disp);letter-spacing:.1em;color:var(--gold);box-shadow:0 0 60px rgba(217,185,122,.2)}
.sn{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;font:600 clamp(13px,1.15vw,18px) var(--disp);white-space:nowrap;color:var(--dim);padding:8px 12px;background:var(--bg);border:1px solid var(--line2);transition:border-color .25s,color .25s,box-shadow .25s}
.sn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mut);transition:background .25s}
.sn:hover,.sn.on{border-color:var(--gold);color:var(--ink)}
.sn.on{box-shadow:0 0 30px rgba(217,185,122,.25)}.sn.on::before{background:var(--gold)}
.sn.dash{border-style:dashed}
.detail{padding:clamp(20px,2.4vw,40px);min-height:200px}
.detail h3{margin:10px 0 10px;font:600 clamp(26px,3vw,50px)/1.05 var(--disp);letter-spacing:-.03em}
.detail p{margin:0;color:var(--dim);font-size:clamp(16px,1.35vw,22px);max-width:26em}
/* why */
.giant{font:700 clamp(80px,min(14vw,26vh),260px)/.85 var(--disp);letter-spacing:-.06em;margin:0;background:linear-gradient(120deg,var(--gold2),var(--gold) 60%,#8a6f3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.stm{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:clamp(14px,2.2vh,26px) 0;border-top:1px solid var(--line)}
.stm:last-child{border-bottom:1px solid var(--line)}
.stm i{font:500 14px var(--disp);color:var(--gold);padding-top:.45em;font-style:normal}
.stm p{margin:0;font:500 clamp(18px,1.9vw,30px)/1.35 var(--disp);letter-spacing:-.015em}
/* roadmap */
.road{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,3vw,48px);padding-top:56px}
.road::before{content:"";position:absolute;left:0;right:0;top:20px;height:1px;background:var(--line2)}
.road::after{content:"";position:absolute;left:0;top:19px;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--gold));transition:width 1.8s cubic-bezier(.6,0,.2,1) .6s}
.slide.in .road::after{width:100%}
.ms{position:relative}
.ms::before{content:"";position:absolute;left:0;top:-42px;width:13px;height:13px;border:2px solid var(--gold);background:var(--bg);border-radius:50%}
.ms:last-child::before{background:var(--gold);box-shadow:0 0 0 6px rgba(217,185,122,.2),0 0 30px rgba(217,185,122,.6)}
.ms small{font:500 12px var(--disp);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.ms p{margin:6px 0 0;font:600 clamp(18px,1.7vw,28px)/1.25 var(--disp);letter-spacing:-.02em}
.quote{margin:0;padding-left:26px;border-left:2px solid var(--gold)}
.quote p{margin:0;font:500 clamp(22px,min(2.8vw,5vh),46px)/1.2 var(--disp);letter-spacing:-.03em;max-width:24em}
.quote cite{display:block;margin-top:12px;font:500 12px var(--disp);letter-spacing:.14em;color:var(--mut);font-style:normal;text-transform:uppercase}
/* end */
.end h1{margin:12px 0 8px;font:700 clamp(54px,min(9vw,17vh),170px)/.9 var(--disp);letter-spacing:-.055em}
/* footer */
#foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:10px clamp(20px,4vw,56px) 18px}
.pg{display:flex;align-items:center;gap:12px;font:500 13px var(--disp);color:var(--mut)}
.pg b{font:700 20px var(--disp);color:var(--ink)}
.pbar{width:clamp(80px,14vw,220px);height:2px;background:var(--line2);position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);width:0;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.hintk{font:400 12px var(--disp);color:var(--mut);letter-spacing:.04em;text-align:center}
.arrows{display:flex;justify-content:flex-end;gap:8px}
.arrows button{width:46px;height:46px;border:1px solid var(--line2);display:grid;place-items:center;transition:border-color .25s,background .25s}
.arrows button:hover{border-color:var(--gold);background:rgba(217,185,122,.08)}
.arrows button[disabled]{opacity:.3;pointer-events:none}
.arrows svg{width:18px;height:18px}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:rgba(7,9,13,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;overflow-y:auto;padding:calc(40px + env(safe-area-inset-top,0px)) clamp(20px,4vw,56px) 40px}
.ov.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.ovh{display:flex;justify-content:space-between;align-items:baseline;max-width:1720px;margin:0 auto 30px}
.ovh h2{margin:0;font:600 clamp(26px,3vw,48px) var(--disp);letter-spacing:-.03em}
.ovh button{font:500 13px var(--disp);color:var(--dim);border:1px solid var(--line2);padding:8px 14px}
.map{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));max-width:1720px;margin:0 auto;height:min(62vh,540px)}
.map::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line2);pointer-events:none}
.mn button{display:grid;grid-template-rows:1fr 26px 1fr;height:100%;width:100%;text-align:left;padding:0}
.mc{padding:0 10px}
.mc.top{grid-row:1;align-self:end;padding-bottom:22px}
.mc.bot{grid-row:3;align-self:start;padding-top:22px}
.mc i{display:block;font:500 12px var(--disp);color:var(--gold);letter-spacing:.14em;font-style:normal;margin-bottom:6px}
.mc b{display:block;font:600 clamp(16px,1.35vw,22px)/1.15 var(--disp);letter-spacing:-.01em;margin-bottom:6px;transition:color .25s}
.mc p{margin:0;color:var(--mut);font-size:13px;line-height:1.4}
.mc .ic{filter:grayscale(1) brightness(1.7);font-size:22px;display:block;margin-bottom:10px}
.mdot{grid-row:2;display:flex;align-items:center;padding-left:10px}
.mdot::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid var(--mut);background:var(--bg);transition:all .3s}
.mn.done .mdot::before{border-color:var(--gold);background:var(--gold)}
.mn.cur .mdot::before{border-color:var(--gold);box-shadow:0 0 0 6px rgba(217,185,122,.22),0 0 24px rgba(217,185,122,.6)}
.mn button:focus-visible{outline:1px solid var(--gold);outline-offset:-2px}
.mn:hover .mc b{color:var(--gold2)}
.mn:hover .mdot::before{border-color:var(--gold)}
.kgrid{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.kgrid div{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font:500 15px var(--disp);color:var(--dim)}
.kgrid kbd{font-size:12px;padding:3px 8px;color:var(--ink)}
.kgrid button{font:500 15px var(--disp);color:var(--dim);display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 0;border-bottom:1px solid var(--line)}
.kgrid button:hover{color:var(--gold2)}
#notes{display:none;position:fixed;left:clamp(20px,4vw,56px);bottom:84px;z-index:15;width:min(520px,calc(100vw - 40px));background:rgba(9,12,17,.96);border:1px solid var(--gold);padding:14px 18px;color:var(--dim);font-size:14px}
#notes.on{display:block}
#notes b{display:block;font:500 11px var(--disp);letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
#pres{display:none;position:fixed;right:clamp(20px,4vw,56px);top:76px;z-index:15;width:min(360px,calc(100vw - 40px));background:rgba(9,12,17,.97);border:1px solid var(--gold);padding:16px;font-size:14px;color:var(--dim)}
#pres.on{display:block}
#pres b{display:block;font:500 11px var(--disp);letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin:8px 0 4px}
#pres h5{margin:0;font:700 34px var(--disp);color:var(--ink)}
#badge{display:none;position:fixed;left:clamp(20px,4vw,56px);bottom:20px;z-index:15;font:700 11px var(--disp);letter-spacing:.14em;background:var(--gold);color:#14100a;padding:5px 10px}
body.teams #badge{display:block}
body.teams .hintk,body.teams #dust,body.teams .orbit svg{display:none}
body.teams #hud{padding-top:36px}
/* responsive */
@media(max-width:1560px){.brand span,.brand i,.tools kbd{display:none}}
@media(max-width:1100px){
  .c2,.c2b{grid-template-columns:1fr}
  .orbit{--pw:min(40vh,56vw)}
  .rn span,.brand span,.hintk{display:none}
  .rn.cur span{display:inline;max-width:140px}
  .map{display:block;height:auto;padding-left:34px}
  .map::before{left:6px;right:auto;top:0;bottom:0;width:1px;height:auto}
  .mn{position:relative}.mn button{display:block}
  .mc.top,.mc.bot{padding:0 0 22px 18px}.mdot{display:none}
  .mn::before{content:"";position:absolute;left:-34px;top:4px;width:13px;height:13px;border-radius:50%;border:2px solid var(--mut);background:var(--bg)}
  .mn.done::before,.mn.cur::before{border-color:var(--gold);background:var(--gold)}
  .cs{--cs:min(86vw,60vh)}
  .hl ol,.road,.stairs{grid-template-columns:1fr}
  .stairs{height:auto}.step{height:auto!important;min-height:120px}
  .hl-line,.hl li::before{display:none}.hl li{padding-top:0;border-left:2px solid var(--gold);padding-left:16px}.hl li small{position:static;display:block;margin-bottom:6px}
  .road::before,.road::after,.ms::before{display:none}.road{padding-top:0}
  .stm{grid-template-columns:44px 1fr}
}
@media(max-width:700px){
  .cs{width:100%;height:auto;display:grid;gap:8px}.cs svg,.cs .core{display:none}.sn{position:static!important;transform:none;white-space:normal}
  #hud{grid-template-columns:1fr auto;padding-top:14px}#rail{display:none}
  .tools button:not(#clock):not([data-act=map]){display:none}
  .cl{display:none}.orbit{--pw:min(44vw,32vh)}
  #foot{grid-template-columns:1fr auto}.hintk{display:none}
  .log li{grid-template-columns:1fr;gap:4px}
  .kgrid{grid-template-columns:1fr}
  .spec div{grid-template-columns:1fr;gap:2px}
}
@media(max-height:760px) and (min-width:1101px){#hud{padding-top:12px}.arrows button{width:40px;height:40px}.go,.ghost{height:48px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}#dust{display:none}}
</style>
</head>

</div>
<div id="map" class="ov" role="dialog" aria-label="World map"></div>
<div id="keys" class="ov" role="dialog" aria-label="Keyboard shortcuts"></div>

      <div class="row"><span>Food</span>${['No allergies','Has allergies'].map(v => `<button class="opt" data-d="food">${v}</button>`).join('')}</div>
      <div class="out" id="out">Pick one from each row.</div></div></div></div></div>` },
 { s: "Training", icon: "📜", title: "Learning on the job", lead: "Three steps closer to the product.", notes: "Tie each one to what the team sells and supports.", sp: [60, 60],
   r: () => `<div class="slide">${hd(4, 'Training')}<div style="display:grid;gap:12px"><h2 class="ttl" data-r>Learning on the job</h2><p class="lead" data-r>Three steps closer to the product.</p></div>
     <div class="stairs" data-r><div class="step" style="--h:46%;--k:0"><span class="no">01</span><small>Internship</small><h3>Technical Support</h3><p>3 months at BVS.</p></div><div class="step" style="--h:72%;--k:1"><span class="no">02</span><small>Courses</small><h3>IBM DataPower</h3><p>Completed.</p></div><div class="step" style="--h:98%;--k:2"><span class="no">03</span><small>Courses</small><h3>IBM MQ</h3><p>Completed.</p></div></div></div>` },
 { s: "Interests", icon: "🎮", title: "Hobby select", lead: "Pick a hobby.", notes: "Let someone in the room pick a hobby. Then tell the gym story: effort in, result out.", sp: [40, 45],
   r: () => `<div class="slide"><div class="cols c2b"><div style="display:grid;gap:clamp(12px,2.2vh,24px)">${hd(5, 'Interests')}<h2 class="ttl" data-r>Hobby select</h2><p class="lead" data-r>Pick a hobby.</p>
     <div class="hsel" data-r><button class="hs" data-h="music"><i>01</i><span><b>Music</b><small>All kinds, mostly calm</small></span></button><button class="hs" data-h="gym"><i>02</i><span><b>Gym</b><small>I love the process</small></span></button><button class="hs" data-h="nature"><i>03</i><span><b>Travel & nature</b><small>Quiet places</small></span></button></div></div>
     <div class="pnl stagebox" id="hgame" data-r></div></div></div>` },
 { s: "Strengths", icon: "💪", title: "What I bring, what I'm building", lead: "I learn fast, and I'm open to learning anything.", notes: "Keep it relaxed. A personal story stays off the screen; tell it live.", sp: [55, 40],
   r: () => `<div class="slide"><div class="cols c2"><div style="display:grid;gap:clamp(12px,2.2vh,24px)">${hd(6, 'Strengths')}<h2 class="ttl" data-r>What I bring, what I'm building</h2><p class="lead" data-r>I learn fast, and I'm open to learning anything.</p>
     <div class="pnl detail" data-r id="det"></div></div>
     <div class="cs" data-r><svg viewBox="0 0 100 100" aria-hidden="true" id="csl"></svg><div class="core">ABDELRAHMAN</div>${SN.map((x, k) => { const a = (-90 + k * 72) * Math.PI / 180; return `<button class="sn ${x.dash ? 'dash' : ''}" data-sn="${k}" style="left:${50 + 41 * Math.cos(a)}%;top:${50 + 41 * Math.sin(a)}%">${e(x.t)}</button>`; }).join('')}</div></div></div>` },
 { s: "Why Sales School", icon: "🚀", title: "Why not?", lead: "It's a good opportunity.", notes: "Thank Mr. Sheriff by name. Keep it simple and sincere.", sp: [28, 60],
   r: () => `<div class="slide"><div class="cols c2b"><div style="display:grid;gap:clamp(10px,2vh,22px)">${hd(7, 'Why Sales School')}<h2 class="giant" data-r>Why not?</h2><p class="lead" data-r>It's a good opportunity.</p></div>
     <div data-r><div class="stm"><i>01</i><p>It started with Mr. Sheriff. He saw a future for me in Technical Pre-Sales.</p></div><div class="stm"><i>02</i><p>He believed I could add real value to BVS.</p></div><div class="stm"><i>03</i><p>I'm grateful, and I'm working to prove him right.</p></div></div></div></div>` },
 { s: "Future", icon: "🎯", title: "Stronger tomorrow than today", lead: "No fixed five-year goal yet.", notes: "End calmly. Optional: yesterday you came unprepared, today you came back ready. Say it only if it feels right.", sp: [65, 35],
   r: () => `<div class="slide">${hd(8, 'Future')}<div style="display:grid;gap:12px"><h2 class="ttl" data-r>Stronger tomorrow than today</h2><p class="lead" data-r>No fixed five-year goal yet.</p></div>
     <div class="road" data-r><div class="ms"><small>Today</small><p>I'm early in my career, and I won't pretend otherwise.</p></div><div class="ms"><small>Every day</small><p>My goal now: learn something new every day.</p></div><div class="ms"><small>Tomorrow</small><p>Stronger tomorrow than today.</p></div></div>
     <blockquote class="quote" data-r><p>“I never want to go to sleep feeling that today gave me nothing.”</p><cite>My one rule</cite></blockquote></div>` }
];
var SN = [
 { t: "Fast learner", h: "Fast learner", p: "I pick things up quickly and adapt.", k: "Strength" },
 { t: "Disciplined", h: "Disciplined", p: "I stay consistent and finish what I start.", k: "Strength" },
 { t: "Communication", h: "Communication", p: "I communicate comfortably with people.", k: "Strength" },
 { t: "Improvising", h: "Improvising", p: "I think I can improvise when I'm put on the spot.", k: "Strength" },
 { t: "Still building", h: "Skills I don't know yet", p: "I'm early in my career, so there are skills I don't even know I'm missing. I'm open to learning all of them.", k: "Still building", dash: 1 }
];
const N = W.length, last = N + 1;
let i = 0, busy = false, left = 600, timerOn = false, tick, snd = false, AC, pick = {}, reps = 0, sky = 0, pw = null, teams = false, sn = 0;
const seen = new Set();

/* ---- sound ---- */
function ac(){ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .12, type = 'sine', vol = .05){ try { const a = ac(), o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.0008, a.currentTime + d); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d); } catch (_) {} }
const beep = (f, d) => { if (snd) tone(f, d); };

/* ---- scenes ---- */
function heroHTML(){ return `<div class="slide hero"><div class="cols c2"><div style="display:grid;gap:clamp(14px,2.8vh,30px)">
  <div class="eye" data-r>Personal portfolio · BVS Sales School</div>
  <h1 data-r>ABDELRAHMAN<span>THE GAME</span></h1>
  <p class="role" data-r>Technical Pre-Sales <em>/</em> BVS Sales Team</p>
  <p class="lead" data-r>I'm 22 and just getting started. Fresh graduate, class of 2026, Computer Science.</p>
  <div class="cta" data-r><button class="go" data-go="1">Start journey<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="ghost" data-act="map">World map<kbd>M</kbd></button></div>
  <div class="metrics" data-r><div><b>22</b>years old</div><div><b>2026</b>class of</div><div><b>3 mo</b>Technical Support</div></div></div>
  ${portrait('', `<div class="cl a" data-r>Role<b>Technical Pre-Sales</b></div><div class="cl b" data-r>Class of 2026<b>Computer Science</b></div><div class="cl c" data-r>Team<b>BVS Sales Team</b></div><div class="cl d" data-r>Status<b>Just getting started</b></div>`)}</div></div>`; }
function endHTML(){ return `<div class="slide end"><div class="cols c2"><div style="display:grid;gap:clamp(10px,2vh,22px)"><div class="eye" data-r>Connection established</div><h1 data-r>Thank you.</h1><p class="lead" data-r style="font-size:clamp(22px,2.4vw,38px);color:var(--ink)">Questions?</p>
  <div class="metrics" data-r><div><b>ABDELRAHMAN</b>BVS Sales Team</div></div>
  <div class="cta" data-r><button class="ghost" data-act="map">World map<kbd>M</kbd></button><button class="ghost" data-go="0">Back to start</button></div></div>${portrait('')}</div></div>`; }

const HG = {
  music: () => `<span class="lab">Music · all kinds, mostly calm</span><div class="pad" style="margin-top:14px">${[261.63,293.66,329.63,392,440,523.25].map(f => `<button class="key" data-f="${f}" aria-label="Play note"></button>`).join('')}</div><div class="out">Tap the keys and play something calm.</div>`,
  gym: () => `<span class="lab">Gym · I love the process</span><div class="lift" style="margin-top:14px"><button class="go" id="lift">Lift</button>
    <svg width="170" height="76" viewBox="0 0 150 70" aria-hidden="true"><g class="bar" id="barb"><rect x="6" y="28" width="12" height="30" fill="#d9b97a"/><rect x="132" y="28" width="12" height="30" fill="#d9b97a"/><rect x="18" y="38" width="114" height="8" fill="#eceff4"/><rect x="0" y="34" width="6" height="18" fill="#717c8f"/><rect x="144" y="34" width="6" height="18" fill="#717c8f"/></g></svg></div>
    <div class="mt"><small>Effort in</small><div class="meter"><i id="m1"></i></div><small>Result out</small><div class="meter o"><i id="m2"></i></div></div><div class="out" id="lm">In the gym, effort pays back honestly. Tap Lift.</div>`,
  nature: () => `<span class="lab">Travel · quiet places · nature</span><svg id="sk" viewBox="0 0 300 150" width="100%" style="display:block;margin:14px 0;max-height:34vh" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop id="s1" offset="0" stop-color="#7cc3ee"/><stop id="s2" offset="1" stop-color="#fff0cf"/></linearGradient></defs><rect width="300" height="150" fill="url(#g)"/><circle id="sun" cx="210" cy="40" r="16" fill="#fff6c9"/><polygon points="0,110 60,60 110,100 170,50 240,105 300,70 300,110" fill="#3f4a7a"/><rect y="105" width="300" height="45" fill="#27406b"/><rect y="112" x="60" width="90" height="2" fill="#fff" opacity=".35"/><rect y="124" x="150" width="80" height="2" fill="#fff" opacity=".25"/></svg>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><button class="go" id="skb">Change the sky</button><span class="out" style="border:0;padding:0;margin:0;min-height:0">I love to travel, quiet places, and nature.</span></div>`
};
const SKIES = [['#7cc3ee','#fff0cf','#fff6c9',210,40],['#f3a85c','#ffe6b0','#fff3c0',250,75],['#6d4f98','#ff9f7a','#ffb37a',60,85],['#0b1030','#2d3a7a','#f4efe0',80,35]];
function pickHobby(h){ $$('.hs').forEach(x => x.classList.toggle('on', x.dataset.h === h)); const g = $('#hgame'); if (g){ g.innerHTML = HG[h](); reps = 0; sky = 0; } }
function pickStrength(k){ sn = k; const x = SN[k]; $$('.sn').forEach(b => b.classList.toggle('on', +b.dataset.sn === k)); const d = $('#det'); if (d) d.innerHTML = `<span class="lab">${e(x.k)}</span><h3>${e(x.h)}</h3><p>${e(x.p)}</p>`; }

function render(){
  const st = $('#stage'); pick = {}; reps = 0;
  const h = i === 0 ? heroHTML() : i === last ? endHTML() : W[i - 1].r();
  st.innerHTML = h; st.scrollTop = 0;
  const sl = st.firstElementChild; sl.querySelectorAll('[data-r]').forEach((el, k) => el.style.setProperty('--d', k));
  requestAnimationFrame(() => requestAnimationFrame(() => sl.classList.add('in')));
  if (i >= 1 && i <= N){ const w = W[i - 1]; $('#bg').style.setProperty('--sx', w.sp[0] + '%'); $('#bg').style.setProperty('--sy', w.sp[1] + '%'); } else { document.documentElement.style.setProperty('--sx', '30%'); $('#bg').style.setProperty('--sx', i === 0 ? '28%' : '50%'); $('#bg').style.setProperty('--sy', '40%'); }
  if (i === 5) pickHobby('music'); if (i === 6){ const l = $('#csl'); l.innerHTML = SN.map((_, k) => { const a = (-90 + k * 72) * Math.PI / 180; return `<line x1="50" y1="50" x2="${50 + 41 * Math.cos(a)}" y2="${50 + 41 * Math.sin(a)}"/>`; }).join(''); pickStrength(0); }
  $('#rail').innerHTML = W.map((w, k) => `<button class="rn ${i === k + 1 ? 'cur' : seen.has(k + 1) ? 'done' : ''}" data-go="${k + 1}" title="World ${two(k + 1)} · ${e(w.s)}" aria-label="World ${k + 1}: ${e(w.s)}"><i style="font-style:normal">${two(k + 1)}</i><span>${e(w.s)}</span></button>`).join('');
  $('#pgn').textContent = two(i); $('#pfill').style.width = (i / last * 100) + '%';
  $('#prev').disabled = i === 0; $('#next').disabled = i === last;
  const nt = $('#notes'); nt.innerHTML = `<b>Speaker notes</b>${e(i >= 1 && i <= N ? W[i - 1].notes : i === 0 ? 'Press Enter to start the journey.' : 'Hold the last line. Wait for questions.')}`;
  upd();
}
function go(n){
  n = Math.max(0, Math.min(last, n)); if (busy || n === i) return; busy = true; closeOv();
  $('#stage').classList.add('leave'); beep(660, .08);
  setTimeout(() => { i = n; if (i >= 1 && i <= N) seen.add(i); render(); $('#stage').classList.remove('leave'); busy = false; }, 170);
}
/* ---- overlays ---- */
function closeOv(){ $('#map').classList.remove('on'); $('#keys').classList.remove('on'); }
function openMap(){
  const m = $('#map'); if (m.classList.contains('on')){ closeOv(); return; } closeOv();
  m.innerHTML = `<div class="ovh"><h2>The journey</h2><button data-act="close">Close · Esc</button></div><div class="map">` + W.map((w, k) => `<div class="mn ${i === k + 1 ? 'cur' : seen.has(k + 1) ? 'done' : ''}"><button data-go="${k + 1}"><div class="mc ${k % 2 ? 'top' : 'bot'}"><span class="ic" aria-hidden="true">${w.icon}</span><i>${two(k + 1)}${seen.has(k + 1) ? ' · cleared' : ''}</i><b>${e(w.s)}</b><p>${e(w.lead)}</p></div><div class="mdot" style="grid-row:2"></div></button></div>`).join('') + `</div>`;
  m.classList.add('on'); const c = $('.mn.cur button'); if (c) c.focus({preventScroll: true});
}
function openKeys(){
  const k = $('#keys'); if (k.classList.contains('on')){ closeOv(); return; } closeOv();
  const rows = [['Previous / next', '← →'], ['Jump to a world', '1 – 8'], ['Start / title', 'Enter / 0'], ['World map', 'M'], ['Timer', 'T'], ['Sound', 'S'], ['Presentation mode', 'L'], ['Speaker notes', 'N', 'notes'], ['Presenter window', 'P', 'pres'], ['Close overlays', 'Esc']];
  k.innerHTML = `<div class="ovh"><h2>Shortcuts</h2><button data-act="close">Close · Esc</button></div><div class="kgrid">${rows.map(r => r[2] ? `<button data-act="${r[2]}"><span>${r[0]}</span><kbd>${r[1]}</kbd></button>` : `<div><span>${r[0]}</span><kbd>${r[1]}</kbd></div>`).join('')}</div>`;
  k.classList.add('on');
}
/* ---- presenter / timer / modes ---- */
const fmt = n => (n < 0 ? '-' : '') + two(Math.floor(Math.abs(n) / 60)) + ':' + two(Math.abs(n) % 60);
function toggleTimer(){ timerOn = !timerOn; clearInterval(tick); $('#clock').classList.toggle('on', timerOn); if (timerOn) tick = setInterval(() => { left--; $('#clock').textContent = fmt(left); upd(); }, 1000); }
function toggleSound(){ snd = !snd; $('#snd').textContent = snd ? 'Sound on' : 'Sound off'; $('#snd').classList.toggle('on', snd); $('#snd').setAttribute('aria-pressed', snd); if (snd) tone(990, .15); }
function toggleTeams(){ teams = !teams; document.body.classList.toggle('teams', teams); $('#tm').classList.toggle('on', teams); $('#tm').setAttribute('aria-pressed', teams); }
function presenter(){
  try { pw = window.open('', 'presenter', 'width=440,height=580'); if (!pw || pw.closed) throw 0; pw.document.write('<title>Presenter</title><body style="font:20px system-ui;background:#0b0e14;color:#eceff4;padding:18px"><small style="color:#d9b97a">NOW</small><h3 id=a></h3><p id=n style="color:#a4adbd"></p><hr><small style="color:#d9b97a">NEXT</small><p id=x></p><h1 id=t></h1>'); pw.document.close(); $('#pres').classList.remove('on'); }
  catch (_) { pw = null; $('#pres').classList.toggle('on'); }
  upd();
}
function upd(){
  const w = W[i - 1], nx = W[i], cur = i === 0 ? 'Title screen' : i === last ? 'The end' : `${two(i)} · ${w.s}`, nt = i >= N ? (i === N ? 'The end' : '') : `${two(i + 1)} · ${nx.s}`, nn = w ? w.notes : i === 0 ? 'Press Enter to start the journey.' : 'Hold the last line. Wait for questions.';
  $('#pres').innerHTML = `<b>Now</b>${e(cur)}<p style="margin:6px 0">${e(nn)}</p><b>Next</b>${e(nt || '—')}<b>Timer</b><h5>${fmt(left)}</h5>`;
  try { if (pw && !pw.closed){ const d = pw.document; d.getElementById('a').textContent = cur; d.getElementById('n').textContent = nn; d.getElementById('x').textContent = nt || '—'; d.getElementById('t').textContent = fmt(left); } } catch (_) {}
}
/* ---- events ---- */
document.addEventListener('click', ev => {
  const t = ev.target, g = t.closest('[data-go]'); if (g){ go(+g.dataset.go); return; }
  const a = t.closest('[data-act]');
  if (a){ const x = a.dataset.act; ({ next: () => go(i + 1), prev: () => go(i - 1), map: openMap, keys: openKeys, close: closeOv, timer: toggleTimer, snd: toggleSound, teams: toggleTeams, notes: () => $('#notes').classList.toggle('on'), pres: presenter }[x] || (() => {}))(); return; }
  const o = t.closest('.opt');
  if (o){ $$('.opt[data-d="' + o.dataset.d + '"]').forEach(x => x.classList.remove('on')); o.classList.add('on'); pick[o.dataset.d] = o.textContent; beep(520, .06);
    if (pick.budget && pick.vibe && pick.food) $('#out').textContent = `Your plan: ${pick.vibe === 'Calm' ? 'quiet places and slow days' : 'lively events and busy spots'}, matched to a ${pick.budget.toLowerCase()} budget, with ${pick.food === 'Has allergies' ? 'allergy-safe food options' : 'open food choices'}.`; return; }
  const hs = t.closest('.hs'); if (hs){ pickHobby(hs.dataset.h); beep(660, .06); return; }
  const sb = t.closest('.sn'); if (sb){ pickStrength(+sb.dataset.sn); beep(520, .06); return; }
  const kk = t.closest('.key'); if (kk){ tone(+kk.dataset.f, 1.2, 'triangle', .13); kk.classList.add('hit'); setTimeout(() => kk.classList.remove('hit'), 240); return; }
  if (t.closest('#lift')){ reps++; const p = Math.min(100, (reps % 10 || 10) * 10); $('#m1').style.width = p + '%'; $('#m2').style.width = p + '%'; $('#barb').style.transform = 'translateY(-14px)'; setTimeout(() => $('#barb') && ($('#barb').style.transform = ''), 200); beep(300 + reps * 25, .08);
    $('#lm').textContent = reps % 10 === 0 ? 'Set complete. Effort in, result out.' : `${reps} rep${reps > 1 ? 's' : ''}. Keep going.`; return; }
  if (t.closest('#skb')){ sky = (sky + 1) % SKIES.length; const k = SKIES[sky]; $('#s1').setAttribute('stop-color', k[0]); $('#s2').setAttribute('stop-color', k[1]); const s = $('#sun'); s.setAttribute('fill', k[2]); s.setAttribute('cx', k[3]); s.setAttribute('cy', k[4]); beep(440, .08); }
});
document.addEventListener('keydown', ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return; const k = ev.key.toLowerCase(), ovOpen = $('#map').classList.contains('on') || $('#keys').classList.contains('on');
  if (ev.key === 'Escape'){ closeOv(); $('#pres').classList.remove('on'); return; }
  if (ev.key === 'ArrowRight' || ev.key === 'PageDown'){ ev.preventDefault(); go(i + 1); }
  else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp'){ ev.preventDefault(); go(i - 1); }
  else if (ev.key === 'Enter' && i === 0 && !ovOpen && document.activeElement.tagName !== 'BUTTON'){ go(1); }
  else if (/^[0-8]$/.test(ev.key)) go(+ev.key);
  else if (k === 'm') openMap(); else if (ev.key === '?' || (ev.key === '/' && ev.shiftKey)) openKeys();
  else if (k === 't') toggleTimer(); else if (k === 's') toggleSound(); else if (k === 'l') toggleTeams();
  else if (k === 'n') $('#notes').classList.toggle('on'); else if (k === 'p') presenter();
});
/* gentle parallax on the portrait */
addEventListener('pointermove', ev => { const im = $('.orbit img'); if (im && !teams) im.style.transform = `translate(${(ev.clientX / innerWidth - .5) * -12}px,${(ev.clientY / innerHeight - .5) * -9}px)`; });
/* fine drifting particles */
const cv = $('#dust'), cx = cv.getContext('2d'); let P = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; P = Array.from({length: Math.min(46, innerWidth / 30 | 0)}, () => ({x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.3 + .3, v: Math.random() * .18 + .03, a: Math.random() * .4 + .1, d: Math.random() * 6.3})); }
function loop(t){ cx.clearRect(0, 0, cv.width, cv.height); for (const p of P){ p.y -= p.v; p.x += Math.sin(t / 3200 + p.d) * .15; if (p.y < -4){ p.y = cv.height + 4; p.x = Math.random() * cv.width; } cx.fillStyle = `rgba(241,220,171,${p.a * (.6 + .4 * Math.sin(t / 1100 + p.d))})`; cx.fillRect(p.x, p.y, p.r * 1.4, p.r * 1.4); } requestAnimationFrame(loop); }
if (!matchMedia('(prefers-reduced-motion:reduce)').matches){ size(); addEventListener('resize', size); requestAnimationFrame(loop); }
$('#clock').textContent = fmt(left);
render();
</script>
