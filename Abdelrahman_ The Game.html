<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdelrahman: The Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060f;--ink:#f4efe6;--dim:#aaa4be;--gold:#e6bf73;--gold2:#f7e1a8;--vio:#a99bff;--glass:rgba(255,255,255,.055);--bd:rgba(255,255,255,.13);
  --disp:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:clamp(18px,2.3vw,21px);line-height:1.6;overflow:hidden;
  background-image:radial-gradient(60% 50% at 12% 8%,rgba(139,124,255,.24),transparent 62%),radial-gradient(50% 45% at 92% 88%,rgba(230,191,115,.17),transparent 62%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:radial-gradient(circle,#fff 1px,transparent 1.4px);background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%)}
body::after{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(40% 35% at 70% 30%,rgba(120,100,255,.13),transparent 70%);animation:aur 26s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(-14%,18%) scale(1.2)}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;padding:0 18px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--dim)}
.hud b{color:var(--gold);font-weight:700}
.p1{display:flex;align-items:center;gap:9px}
.p1 img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold)}
.hud button{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--dim);padding:7px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--bd)}
.seg{display:flex;gap:5px;padding-bottom:8px}
.seg i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .5s,box-shadow .5s}
.seg i.seen{background:rgba(230,191,115,.5)}
.seg i.cur{background:var(--gold);box-shadow:0 0 12px rgba(230,191,115,.8)}
main{flex:1;min-height:0;overflow-y:auto;padding:18px 0 24px}
.slide{animation:in .3s ease-out;max-width:780px}
@keyframes in{from{opacity:0;transform:translateX(14px)}}
.tag{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--vio);margin-bottom:14px;line-height:1.6}
h2{font-family:var(--disp);font-weight:600;font-size:clamp(15px,3vw,20px);line-height:1.5;color:var(--gold);margin:0 0 12px;letter-spacing:.01em}
.lead{font-family:var(--disp);font-weight:700;font-size:clamp(26px,5.4vw,40px);line-height:1.2;letter-spacing:-.02em;margin:0 0 22px;max-width:18em}
.sub{color:var(--dim);margin:0 0 18px;max-width:30em}
.avatar{width:clamp(112px,26vw,170px);aspect-ratio:1;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 0 7px rgba(230,191,115,.14),0 24px 60px rgba(0,0,0,.55);object-fit:cover;background:#fff;display:block;margin-bottom:22px}
.polaroid{display:inline-block;background:#f4efe6;color:#17132f;padding:8px 8px 10px;border-radius:4px;transform:rotate(-3deg);box-shadow:0 20px 50px rgba(0,0,0,.55);margin:0 0 20px}
.polaroid img{display:block;width:clamp(130px,30vw,190px);aspect-ratio:4/5;object-fit:cover}
.polaroid i{display:block;text-align:center;font-style:normal;font-weight:700;font-size:15px;padding-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.stat,.card,.box,.stamp{background:var(--glass);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat{padding:14px 16px;font-weight:700}
.stat small{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:var(--gold);margin-bottom:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{background:var(--glass);border:1px solid var(--bd);padding:6px 15px;border-radius:99px;font-weight:700;font-size:.88em}
.pts{list-style:none;margin:0 0 16px;padding:0}
.pts li{display:flex;gap:14px;margin-bottom:14px;max-width:30em}
.pts li::before{content:"";flex:none;width:9px;height:9px;margin-top:.62em;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(230,191,115,.18)}
.tl{border-left:2px solid rgba(255,255,255,.14);margin:0 0 18px 6px;padding-left:24px}
.tl div{position:relative;margin-bottom:20px;font-weight:700;font-size:1.08em}
.tl div::before{content:"";position:absolute;left:-31px;top:.55em;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(230,191,115,.18)}
.tl small{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:var(--vio);margin-bottom:6px;font-weight:600}
.tl span{display:block;color:var(--dim);font-weight:500;font-size:.9em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.card{padding:16px 18px;text-align:left;width:100%;display:block;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);border-color:rgba(230,191,115,.55)}
.card.open,.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 12px 40px rgba(230,191,115,.15)}
.card .k{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:var(--vio);margin-bottom:10px;line-height:1.6;font-weight:600}
.card .t{display:block;font-weight:800;font-size:1.08em}
.card .more{display:none;color:var(--dim);margin-top:10px;font-size:.92em;font-weight:500}
.card.open .more{display:block}
.hint{color:var(--dim);font-size:.85em;margin:-4px 0 12px}
.stamp{position:relative;padding:20px 20px;margin-bottom:18px;max-width:560px}
.stamp .st{position:absolute;right:14px;top:-16px;font-family:var(--disp);font-weight:700;letter-spacing:.14em;font-size:clamp(12px,2.8vw,16px);color:#6ee7a8;border:2px solid #6ee7a8;border-radius:10px;padding:7px 14px;transform:rotate(-6deg);background:rgba(7,6,15,.85);animation:slam .6s cubic-bezier(.2,1.5,.4,1) .5s both}
@keyframes slam{from{transform:rotate(-6deg) scale(2.6);opacity:0}}
.stamp b{display:block;font-size:1.15em;font-weight:800}
.stamp span{color:var(--dim);font-size:.92em}
.box{padding:18px;margin-bottom:16px}
.box h3{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.16em;color:var(--gold);margin:0 0 12px;line-height:1.7}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.row>span{font-size:.85em;color:var(--dim);min-width:68px}
.opt{background:var(--glass);border:1px solid var(--bd);padding:7px 15px;border-radius:99px;font-weight:700;font-size:.9em;transition:border-color .2s,background .2s}
.opt.on{border-color:var(--gold);background:rgba(230,191,115,.16)}
.out{min-height:3.2em;color:var(--gold2);font-weight:700}
.pxbtn{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.14em;color:#1a1204;background:linear-gradient(135deg,var(--gold2),var(--gold));padding:15px 24px;border-radius:99px;box-shadow:0 10px 30px rgba(230,191,115,.28);transition:transform .2s,box-shadow .2s}
.pxbtn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(230,191,115,.4)}
.pxbtn:active{transform:scale(.97)}
.keys7{display:flex;gap:8px;margin-bottom:12px}
.key{flex:1;height:90px;background:linear-gradient(#2a2550,#17143a);border:1px solid var(--bd);border-radius:6px 6px 14px 14px;transition:background .18s,box-shadow .18s}
.key.hit{background:linear-gradient(var(--gold2),var(--gold));box-shadow:0 0 24px rgba(230,191,115,.6)}
.lift{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.bar{transition:transform .2s ease-out}
.mt small{font-family:var(--disp);font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:600}
.meter{height:10px;border-radius:6px;background:rgba(255,255,255,.1);margin:7px 0 13px;overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .25s}
.meter.o i{background:linear-gradient(90deg,#8b7cff,#5eead4)}
.quote{border-left:2px solid var(--gold);padding-left:20px;margin:6px 0 16px;max-width:27em;font-size:1.2em;font-weight:700}
.quote small{display:block;color:var(--dim);font-weight:500;margin-top:8px;font-size:.75em}
.title{display:flex;flex-direction:column;justify-content:center;min-height:100%;max-width:none}
.title h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,8vw,64px);line-height:1.1;letter-spacing:-.03em;margin:0 0 14px;background:linear-gradient(120deg,var(--gold2),var(--gold) 55%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.start{align-self:flex-start;margin-top:10px;font-size:13px;padding:17px 30px;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 14px 56px rgba(230,191,115,.6)}}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile .n{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--gold);display:block;margin-bottom:8px}
.tile .ok{float:right;color:#6ee7a8;font-family:var(--disp);font-size:10px;letter-spacing:.14em;font-weight:600}
.end{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;max-width:none}
.end .avatar{margin-inline:auto}
.end h1{font-family:var(--disp);font-weight:700;font-size:clamp(20px,5vw,34px);letter-spacing:.06em;color:var(--gold);margin:0 0 14px;line-height:1.3}
.notes{display:none;background:rgba(10,8,24,.92);border:1px solid var(--bd);border-radius:14px;padding:11px 15px;font-size:.88em;color:var(--dim);margin-bottom:8px}
.notes.on{display:block}
nav{display:flex;gap:8px;padding:8px 0 10px}
nav button{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.14em;background:var(--glass);border:1px solid var(--bd);border-radius:99px;padding:13px;flex:1;transition:border-color .2s}
nav button:hover{border-color:var(--gold)}
nav button[disabled]{opacity:.35;cursor:default}
.keys{color:var(--dim);font-size:.76em;text-align:center;padding-bottom:8px;letter-spacing:.02em}
#map{display:none;position:fixed;inset:0;z-index:9;background:rgba(7,6,15,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(24px + env(safe-area-inset-top,0px)) 18px 24px;overflow-y:auto}
#map.on{display:block}
#map .in{max-width:1000px;margin:0 auto}
#pres{display:none;position:fixed;right:12px;top:64px;width:min(340px,86vw);z-index:8;background:rgba(10,8,24,.95);border:1px solid var(--gold);border-radius:16px;padding:14px;font-size:.85em}
#pres.on{display:block}
#pres h4{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.16em;color:var(--gold);margin:0 0 8px;line-height:1.6}
#badge{display:none;position:fixed;left:14px;top:12px;z-index:8;font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.14em;background:var(--gold);color:#1a1204;padding:6px 10px;border-radius:99px}
body.teams #badge{display:block}
body.teams .keys,body.teams nav{display:none}
body.teams main{font-size:1.1em;padding-bottom:40px}
body.teams .hud{padding-top:34px}
@media(prefers-reduced-motion:reduce){.slide,.start,.stamp .st,body::after{animation:none}}
</style>
</head>
<body>

  <div class="hud"><span class="p1"><img id="mini" alt=""><span>P1 <b id="who"></b></span></span><span>CREDIT <b id="coins">00</b></span><button id="clock" aria-label="Toggle timer">10:00</button><button id="snd" aria-label="Toggle sound">SOUND OFF</button></div>
  <div class="seg" id="seg"></div>

</div>

   blocks: [ { k: "pts", items: ["I'm early in my career, and I won't pretend otherwise.", "My goal now: learn something new every day."] }, { k: "quote", t: "I never want to go to sleep feeling that today gave me nothing.", by: "My one rule" } ],
   notes: "End calmly. Optional: yesterday you came unprepared, today you came back ready. Say it only if it feels right." }
] };
/* ===== END OF EDIT BLOCK ===== */

const $ = q => document.querySelector(q), W = CONFIG.worlds, last = W.length + 1, N = W.length;
const e = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seen = new Set(); let i = 0, menu = false, left = CONFIG.minutes * 60, timerOn = false, tick, snd = false, AC, pick = {}, reps = 0, sky = 0, pw = null;
const two = n => String(n).padStart(2, '0');
function ac(){ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .09, type = 'square', vol = .04){ try { const a = ac(), o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.0008, a.currentTime + d); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d); } catch (_) {} }
const beep = (f, d) => { if (snd) tone(f, d); };

const R = {
  avatar: () => `<img class="avatar" src="${PHOTO}" alt="Portrait of Abdelrahman">`,
  kid: () => KID ? `<div class="polaroid"><img src="${KID}" alt="Abdelrahman as a child"><i>Egypt · where it started</i></div>` : '',
  stats: b => `<div class="stats">${b.items.map(x => `<div class="stat"><small>${e(x[0])}</small>${e(x[1])}</div>`).join('')}</div>`,
  chips: b => `<div class="chips">${b.items.map(x => `<span class="chip">${e(x)}</span>`).join('')}</div>`,
  pts: b => `<ul class="pts">${b.items.map(x => `<li>${e(x)}</li>`).join('')}</ul>`,
  tl: b => `<div class="tl">${b.items.map(x => `<div><small>${e(x[0])}</small>${e(x[1])}<span>${e(x[2])}</span></div>`).join('')}</div>`,
  cards: b => `<div class="hint">Tap a card for more.</div><div class="grid">${b.items.map(x => `<button class="card flip" aria-expanded="false"><span class="k">${e(x[0])}</span><span class="t">${e(x[1])}</span><span class="more">${e(x[2])}</span></button>`).join('')}</div>`,
  stamp: b => `<div class="stamp"><div class="st">${e(b.st)}</div><b>${e(b.a)}</b><span>${e(b.b)}</span></div>`,
  quote: b => `<div class="quote">“${e(b.t)}”<small>— ${e(b.by)}</small></div>`,
  demo: () => `<div class="box"><h3>TRY MY GRADUATION PROJECT</h3><p class="sub" style="margin-bottom:12px">An Egypt tourism website. The tourist answers a few questions and AI builds a customized plan. This is a small demo of the idea.</p>
    <div class="row"><span>Budget</span>${['Low','Medium','High'].map(v => `<button class="opt" data-d="budget">${v}</button>`).join('')}</div>
    <div class="row"><span>Vibe</span>${['Calm','Events'].map(v => `<button class="opt" data-d="vibe">${v}</button>`).join('')}</div>
    <div class="row"><span>Food</span>${['No allergies','Has allergies'].map(v => `<button class="opt" data-d="food">${v}</button>`).join('')}</div>
    <div class="out" id="out">Pick one from each row.</div></div>`,
  hobby: () => `<div class="grid"><button class="card hb" data-h="music"><span class="k">1P · HOBBY</span><span class="t">🎵 Music</span></button><button class="card hb" data-h="gym"><span class="k">1P · HOBBY</span><span class="t">🏋️ Gym</span></button><button class="card hb" data-h="nature"><span class="k">1P · HOBBY</span><span class="t">🌿 Travel & nature</span></button></div><div id="hgame"></div>`
};
const HG = {
  music: () => `<div class="box"><h3>MUSIC · ALL KINDS, MOSTLY CALM</h3><div class="keys7">${[261.63,293.66,329.63,392,440,523.25].map(f => `<button class="key" data-f="${f}" aria-label="note"></button>`).join('')}</div><div class="out">Tap the keys and play something calm.</div></div>`,
  gym: () => `<div class="box"><h3>GYM · I LOVE THE PROCESS</h3><div class="lift"><button class="pxbtn" id="lift">LIFT</button>
    <svg width="150" height="70" viewBox="0 0 150 70" aria-hidden="true"><g class="bar" id="barb"><rect x="6" y="28" width="12" height="30" fill="#e6bf73"/><rect x="132" y="28" width="12" height="30" fill="#e6bf73"/><rect x="18" y="38" width="114" height="8" fill="#f6f3ff"/><rect x="0" y="34" width="6" height="18" fill="#b8935a"/><rect x="144" y="34" width="6" height="18" fill="#b8935a"/></g></svg></div>
    <div class="mt"><small>EFFORT IN</small><div class="meter"><i id="m1"></i></div><small>RESULT OUT</small><div class="meter o"><i id="m2"></i></div></div><div class="out" id="lm">In the gym, effort pays back honestly. Tap LIFT.</div></div>`,
  nature: () => `<div class="box"><h3>TRAVEL · QUIET PLACES · NATURE</h3><svg id="sk" viewBox="0 0 300 150" width="100%" style="max-width:420px;display:block;margin-bottom:12px" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop id="s1" offset="0" stop-color="#7cc3ee"/><stop id="s2" offset="1" stop-color="#fff0cf"/></linearGradient></defs><rect width="300" height="150" fill="url(#g)"/><circle id="sun" cx="210" cy="40" r="16" fill="#fff6c9"/><polygon points="0,110 60,60 110,100 170,50 240,105 300,70 300,110" fill="#3f4a7a"/><rect y="105" width="300" height="45" fill="#27406b"/><rect y="112" x="60" width="90" height="2" fill="#fff" opacity=".35"/><rect y="124" x="150" width="80" height="2" fill="#fff" opacity=".25"/></svg>
    <button class="pxbtn" id="skb">CHANGE THE SKY</button><div class="out" style="margin-top:10px">I love to travel, quiet places, and nature.</div></div>`
};
const SKIES = [['#7cc3ee','#fff0cf','#fff6c9',210,40],['#f3a85c','#ffe6b0','#fff3c0',250,75],['#6d4f98','#ff9f7a','#ffb37a',60,85],['#0b1030','#2d3a7a','#f4efe0',80,35]];

function render(){
  const st = $('#stage'); let h = ''; $('#notes').textContent = '';
  if (menu){
    h = `<div class="slide" style="max-width:none"><div class="tag">SELECT WORLD</div><h2>${N} worlds. One story.</h2><div class="mapgrid">` +
      W.map((w, k) => `<button class="card tile" data-go="${k + 1}"><span class="n">${k + 1}${seen.has(k + 1) ? '<span class="ok">CLEARED</span>' : ''}</span><span class="t">${w.icon} ${e(w.tag.charAt(0) + w.tag.slice(1).toLowerCase())}</span></button>`).join('') + `</div></div>`;
  } else if (i === 0){
    h = `<div class="slide title"><img class="avatar" src="${PHOTO}" alt="Portrait of Abdelrahman"><h1>${e(CONFIG.short.toUpperCase())}:<br>THE GAME</h1><p class="sub">${e(CONFIG.role)} · ${e(CONFIG.team)}</p><button class="pxbtn start" data-go="1">▶ PRESS START</button><div class="tag" style="margin-top:20px;color:var(--dim)">${N} worlds. One story.</div></div>`;
  } else if (i === last){
    h = `<div class="slide end"><img class="avatar" src="${PHOTO}" alt="Portrait of Abdelrahman"><div class="tag">CONNECTION ESTABLISHED</div><h1>${e(CONFIG.short.toUpperCase())}<br>${e(CONFIG.team.toUpperCase())}</h1><p class="lead" style="margin-inline:auto">Thank you.</p><p class="sub">Questions?</p></div>`;
  } else {
    const w = W[i - 1]; pick = {}; reps = 0;
    h = `<div class="slide"><div class="tag">WORLD ${i} · ${e(w.tag)}</div><h2>${w.icon} ${e(w.title)}</h2><p class="lead">${e(w.lead)}</p>${w.blocks.map(b => R[b.k](b)).join('')}</div>`;
    $('#notes').textContent = 'Notes: ' + w.notes;
  }
  st.innerHTML = h; st.scrollTop = 0;
  $('#seg').innerHTML = W.map((_, k) => `<i class="${i === k + 1 && !menu ? 'cur' : seen.has(k + 1) ? 'seen' : ''}"></i>`).join('');
  $('#coins').textContent = two(seen.size);
  $('#prev').disabled = !menu && i === 0; $('#next').disabled = !menu && i === last;
  upd();
}
function go(n){ menu = false; $('#map').classList.remove('on'); i = Math.max(0, Math.min(last, n)); if (i >= 1 && i <= N) seen.add(i); beep(880, .07); render(); }
const fmt = n => (n < 0 ? '-' : '') + two(Math.floor(Math.abs(n) / 60)) + ':' + two(Math.abs(n) % 60);
function toggleTimer(){ timerOn = !timerOn; clearInterval(tick); if (timerOn) tick = setInterval(() => { left--; $('#clock').textContent = fmt(left); upd(); }, 1000); }
function toggleSound(){ snd = !snd; $('#snd').textContent = snd ? 'SOUND ON' : 'SOUND OFF'; if (snd) tone(990, .1); }
function openMap(on){ const m = $('#map'), open = on === undefined ? !m.classList.contains('on') : on; m.classList.toggle('on', open);
  if (open) m.innerHTML = `<div class="in"><div class="tag">SELECT WORLD <span style="color:var(--dim)">· M or Esc to close</span></div><h2>${N} worlds. One story.</h2><div class="mapgrid">` + W.map((w, k) => `<button class="card tile" data-go="${k + 1}"><span class="n">${k + 1}${seen.has(k + 1) ? '<span class="ok">CLEARED</span>' : ''}</span><span class="t">${w.icon} ${e(w.tag.charAt(0) + w.tag.slice(1).toLowerCase())}</span></button>`).join('') + `</div></div>`; }
function presenter(){
  try { pw = window.open('', 'presenter', 'width=420,height=560'); if (!pw || pw.closed) throw 0; pw.document.write('<title>Presenter</title><body style="font:20px system-ui;background:#111;color:#eee;padding:16px"><h3 id=a></h3><p id=n></p><hr><small>NEXT</small><p id=x></p><h1 id=t></h1>'); pw.document.close(); }
  catch (_) { pw = null; $('#pres').classList.toggle('on'); }
  upd();
}
function upd(){
  const w = W[i - 1], nx = W[i], cur = i === 0 ? 'Title screen' : i === last ? 'The end' : w.tag, nt = i >= N ? '' : nx.tag, nn = w ? w.notes : 'Press → to start.';
  $('#pres').innerHTML = `<h4>NOW · ${e(cur)}</h4><p>${e(nn)}</p><h4>NEXT · ${e(nt || '—')}</h4><h4>${fmt(left)}</h4>`;
  try { if (pw && !pw.closed){ pw.document.getElementById('a').textContent = cur; pw.document.getElementById('n').textContent = nn; pw.document.getElementById('x').textContent = nt || '—'; pw.document.getElementById('t').textContent = fmt(left); } } catch (_) {}
}
$('#app').addEventListener('click', ev => {
  const t = ev.target, g = t.closest('[data-go]'); if (g){ go(+g.dataset.go); return; }
  const o = t.closest('.opt');
  if (o){ document.querySelectorAll('.opt[data-d="' + o.dataset.d + '"]').forEach(x => x.classList.remove('on')); o.classList.add('on'); pick[o.dataset.d] = o.textContent; beep(520, .05);
    if (pick.budget && pick.vibe && pick.food) $('#out').textContent = `Your plan: ${pick.vibe === 'Calm' ? 'quiet places and slow days' : 'lively events and busy spots'}, matched to a ${pick.budget.toLowerCase()} budget, with ${pick.food === 'Has allergies' ? 'allergy-safe food options' : 'open food choices'}.`; return; }
  const hb = t.closest('.hb');
  if (hb){ document.querySelectorAll('.hb').forEach(x => x.classList.remove('sel')); hb.classList.add('sel'); $('#hgame').innerHTML = HG[hb.dataset.h](); reps = 0; sky = 0; beep(660, .06); return; }
  const kk = t.closest('.key'); if (kk){ tone(+kk.dataset.f, 1.1, 'triangle', .12); kk.classList.add('hit'); setTimeout(() => kk.classList.remove('hit'), 220); return; }
  if (t.closest('#lift')){ reps++; const p = Math.min(100, (reps % 10 || 10) * 10); $('#m1').style.width = p + '%'; $('#m2').style.width = p + '%'; $('#barb').style.transform = 'translateY(-14px)'; setTimeout(() => $('#barb').style.transform = '', 180); beep(300 + reps * 25, .07);
    $('#lm').textContent = reps % 10 === 0 ? 'Set complete. Effort in, result out.' : `${reps} rep${reps > 1 ? 's' : ''}. Keep going.`; return; }
  if (t.closest('#skb')){ sky = (sky + 1) % SKIES.length; const k = SKIES[sky]; $('#s1').setAttribute('stop-color', k[0]); $('#s2').setAttribute('stop-color', k[1]); $('#sun').setAttribute('fill', k[2]); $('#sun').setAttribute('cx', k[3]); $('#sun').setAttribute('cy', k[4]); beep(440, .06); return; }
  const c = t.closest('.flip'); if (c){ const on = c.classList.toggle('open'); c.setAttribute('aria-expanded', on); beep(440, .04); }
});
$('#next').onclick = () => go(i + 1); $('#prev').onclick = () => go(i - 1); $('#menu').onclick = () => openMap();
$('#clock').onclick = toggleTimer; $('#snd').onclick = toggleSound;
document.addEventListener('keydown', ev => { const k = ev.key.toLowerCase();
  if (ev.key === 'ArrowRight'){ if (!$('#map').classList.contains('on')) go(i + 1); } else if (ev.key === 'ArrowLeft'){ if (!$('#map').classList.contains('on')) go(i - 1); }
  else if (k === 'm') openMap(); else if (ev.key === 'Escape') openMap(false);
  else if (k === 't') toggleTimer(); else if (k === 's') toggleSound(); else if (k === 'l') document.body.classList.toggle('teams');
  else if (k === 'n') $('#notes').classList.toggle('on'); else if (k === 'p') presenter(); });
let sx = null;
document.addEventListener('touchstart', ev => { sx = ev.touches[0].clientX; }, {passive: true});
document.addEventListener('touchend', ev => { if (sx === null) return; const d = ev.changedTouches[0].clientX - sx; sx = null; if (Math.abs(d) > 70 && !ev.target.closest('.card,.key,.box,#map')) (d < 0 ? $('#next') : $('#prev')).click(); }, {passive: true});
$('#who').textContent = CONFIG.short.toUpperCase(); $('#mini').src = PHOTO; $('#clock').textContent = fmt(left);
render();
</script>
</body>
</html>
